# kc-env messages — English (source language).
# Placeholders use Go templates: {{.Name}}. Plural messages have "one"/"other".
# Every ID here must also exist in each other locale (enforced by tests).

help = '''
kc-env {{.Version}} — secrets in profiles, protected by a Secure Enclave key (Touch ID)
(age {{.AgeVersion}}, language: {{.Lang}}; set KC_ENV_LANG, LC_ALL, LC_MESSAGES or LANG to change)

Usage:
  kc-env <command> [args...]

Listing (no Touch ID: only the key-name index is read, never values)
  list [<profile>]              all profiles and key names as a tree (alias: tree)
  profiles                      profile names, one per line
  ls <profile>                  key names of a profile
  ls --verify <profile>         decrypt to check the key names and rebuild the index (Touch ID)

Values
  set <profile> <KEY>           add or replace a value. The value is read from (in order):
                                  1. a hidden prompt on a terminal
                                  2. standard input    e.g. pbpaste | kc-env set work GITHUB_TOKEN
                                  3. a hidden dialog when neither is available
                                Setting a key in an existing profile needs Touch ID
  get <profile> <KEY>           print a value (Touch ID)
                                Avoid it where output is recorded (logs, chat transcripts)
  exec <profile> -- <cmd...>    run cmd with the profile's keys as environment variables (one Touch ID)
                                Values reach only cmd's process, never your shell
                                e.g. kc-env exec work -- gh repo list
  header <profile> <KEY> [--name <Header>] [--prefix <text>]
                                print an HTTP header as JSON (Touch ID). Default:
                                {"Authorization":"Bearer <value>"}. For tools that take headers
                                as JSON from a command. --prefix '' for no prefix
                                e.g. kc-env header work API_TOKEN --name X-Api-Key --prefix ''

Deleting (always Touch ID with the Secure Enclave key, even inside a session)
  rm <profile> <KEY> [<KEY>...] remove keys. Nothing is removed if any key is missing
  rm --all <profile>            remove every key, keep the empty profile (asks first)
  rm-profile <profile>          remove an empty profile (asks first). Refuses while keys remain
  rm-profile --force <profile>  remove a profile and its keys (asks first; cannot be undone)
  Questions use y/N on a terminal, otherwise a dialog (default: cancel)

Wiping everything (e.g. before erasing the Mac)
  destroy                       delete the Secure Enclave key and every secret. Cannot be undone
                                deletes: identity.txt, vault/, run/
                                keeps:   bin/, completions/ (kc-env init starts over)
                                steps: list what is lost, y/N, type a phrase, 10 s countdown,
                                       Touch ID (never a session), delete and verify
                                Runs only from an interactive terminal (not from pipes, dialogs,
                                non-interactive tools, or inside a session)

Sessions (skip Touch ID for a while)
  session [--ttl 30m] [--only p1,p2] [-- <cmd...>]
                                start cmd (default: your shell) in a session. Each profile asks
                                for Touch ID on its first decryption only
                                  --ttl   lifetime (e.g. 15m, 1h, 2h; default 30m, at most 24h)
                                  --only  profiles that may be cached (others always ask)
                                e.g. kc-env session --only work -- zsh
  session status                same as `cache`
  lock                          drop this session's cache (the next use asks again)

  How it works: the `kc-env session` process keeps the decrypted profiles in its own memory.
  Nothing is written to disk and no key is put in the environment (KC_ENV_SESSION is only the
  session ID). kc-env asks that process over a socket under run/, and it answers only
  processes started under cmd, as seen in the kernel's process table. It enforces the TTL and
  --only itself and forgets everything when cmd exits or the TTL passes. Parallel requests
  (e.g. several commands starting at once) share one Touch ID. Caution: every program started
  under cmd can read the cached values without asking — including any tool or agent started
  in it. Keep --only narrow and the TTL short.

Session caches
  cache                         this session: ID, command, expiry, scope, cached profiles
  cache list                    every running session on this Mac (* = this session)
                                Only metadata is shown; another session's values cannot be read
  cache rm <ID>...              end sessions (Touch ID; at least 4 characters of the ID)
  cache rm --current            end this session (Touch ID)
  cache rm --all                end every session (Touch ID)
                                An ended session asks for Touch ID every time until its command
                                exits (`lock` only clears this session's cache, without Touch ID)

Setup
  init                          create the Secure Enclave key (once)
  help, -h, --help              this help
  version                       version

Names
  profile   starts with a letter or digit; letters, digits and . _ -   e.g. work, personal, stg.work
  KEY       starts with a letter or _; letters, digits and _ (a valid environment variable name)
            Names that change how programs start are refused (PATH, HOME, DYLD_*, LD_*,
            KC_ENV_*, NODE_OPTIONS, BASH_ENV, ...)

Authentication
  Every decryption asks for Touch ID, or the macOS login password when Touch ID is unavailable.
  The key lives in the Secure Enclave and cannot leave this Mac. If you lose the Mac, the vault
  cannot be decrypted: reissue your API keys and register them again.

Files (paths used by this invocation)
  program      {{.Self}}
  home         {{.Home}}
  key ref      {{.Identity}}
  sessions     {{.Sessions}}   (sockets of running sessions; no secrets on disk)
  vault        {{.Vault}}
                 <profile>.age   ciphertext (lines of KEY=base64(value))
                 <profile>.keys  key-name index (plaintext, no values)
  completion   {{.Completion}}
                 add its directory to fpath in ~/.zshrc before compinit / oh-my-zsh
  plugin       {{.Plugin}}
               (<home>/bin first, then the absolute directories of PATH)
  kc-env stops if any of these is owned by someone else or writable by group or others.

Moving the home
  Move the whole home (bin/, identity.txt, vault/ ...). The home is always "the directory
  above the program", so no configuration changes are needed, and identity.txt does not
  depend on its path. Only re-create the PATH symlink:
    ln -sf <new home>/bin/kc-env ~/.local/bin/kc-env'''

